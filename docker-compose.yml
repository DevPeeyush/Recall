version: "3.9"

services:
  recall:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - recall_data:/app/.recall_data
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s   # give time for AI models to load

volumes:
  recall_data: